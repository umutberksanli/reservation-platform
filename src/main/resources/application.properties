spring.application.name=event-reservation

# --- MySQL baglantisi ---
# Sifre koda yazilmaz; DB_PASSWORD ortam degiskeninden okunur.
# URL ve kullanici adi icin varsayilanlar var, istenirse DB_URL / DB_USERNAME ile degistirilebilir.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/reservation_platform}
spring.datasource.username=${DB_USERNAME:reservation_app}
spring.datasource.password=${DB_PASSWORD}

# --- Sema yonetimi ---
# Tablolari yalnizca Flyway olusturur (src/main/resources/db/migration).
# Hibernate'in tablo olusturmasi/degistirmesi kapali.
spring.jpa.hibernate.ddl-auto=none
# Veritabani baglantisini HTTP istegi boyunca acik tutma (onerilen ayar).
spring.jpa.open-in-view=false
# Tarih/saatler veritabaninda UTC olarak saklanir (DATETIME saat dilimi tutmaz).
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# MySQL oturumu da UTC olsun: CURRENT_TIMESTAMP (created_at varsayilani) UTC uretir.
spring.datasource.hikari.data-source-properties.connectionTimeZone=UTC
spring.datasource.hikari.data-source-properties.forceConnectionTimeZoneToSession=true

# --- API hata cevaplari ---
# Hatalar standart RFC 9457 "problem+json" formatinda doner.
spring.mvc.problemdetails.enabled=true

# --- Kimlik dogrulama (JWT) ---
# Imza anahtari JWT_SECRET ortam degiskeninden okunur (en az 32 karakter). Tanimli degilse acilista
# rastgele bir anahtar uretilir: yalnizca gelistirme icin; uygulama yeniden baslayinca eski token'lar gecersiz olur.
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.issuer=reservation-platform
app.security.jwt.ttl=PT1H

# Ilk admin: ikisi de tanimliysa acilista bu e-postayla ADMIN kullanici olusturulur (varsa ADMIN yapilir).
app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}
