spring.application.name=event-reservation

# --- MySQL baglantisi ---
# Sifre koda yazilmaz; DB_PASSWORD ortam degiskeninden okunur.
# URL ve kullanici adi icin varsayilanlar var, istenirse DB_URL / DB_USERNAME ile degistirilebilir.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/reservation_platform}
spring.datasource.username=${DB_USERNAME:reservation_app}
spring.datasource.password=${DB_PASSWORD}

# --- Sema yonetimi ---
# Tablolari yalnizca Flyway olusturur (src/main/resources/db/migration).
# Hibernate'in tablo olusturmasi/degistirmesi kapali.
spring.jpa.hibernate.ddl-auto=none
# Veritabani baglantisini HTTP istegi boyunca acik tutma (onerilen ayar).
spring.jpa.open-in-view=false
